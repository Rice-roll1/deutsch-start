.\t我来自中国。\nwohnen\t[ˈvoːnən]\t居住\tWo wohnst du?\t你住在哪里？\nlernen\t[ˈlɛʁnən]\t学习\tWir lernen jeden Tag.\t我们每天学习。\nsprechen\t[ˈʃpʁɛçn̩]\t说；讲\tIch spreche ein wenig Deutsch.\t我会说一点德语。\ngut\t[ɡuːt]\t好的\tMir geht es gut.\t我很好。\nneu\t[nɔɪ̯]\t新的\tDas ist mein neues Buch.\t这是我的新书。\nheute\t[ˈhɔɪ̯tə]\t今天\tHeute habe ich Zeit.\t今天我有时间。\nmorgen\t[ˈmɔʁɡn̩]\t明天\tBis morgen!\t明天见！\nder Name\t[deːɐ̯ ˈnaːmə]\t名字（阳性）\tMein Name ist Anna.\t我的名字是安娜。\nder Tag\t[deːɐ̯ taːk]\t天；白天（阳性）\tDer Tag ist schön.\t今天很美好。\ndie Sprache\t[diː ˈʃpʁaːxə]\t语言（阴性）\tDeutsch ist eine Sprache.\t德语是一种语言。\ndas Wasser\t[das ˈvasɐ]\t水（中性）\tIch trinke Wasser.\t我喝水。\ndas Brot\t[das bʁoːt]\t面包（中性）\tDas Brot ist frisch.\t面包很新鲜。\ndie Milch\t[diː mɪlç]\t牛奶（阴性）\tDie Milch ist kalt.\t牛奶是凉的。\nder Apfel\t[deːɐ̯ ˈapfl̩]\t苹果（阳性）\tIch esse einen Apfel.\t我吃一个苹果。\nder Kaffee\t[deːɐ̯ ˈkafe]\t咖啡（阳性）\tDer Kaffee ist heiß.\t咖啡很烫。\nder Tee\t[deːɐ̯ teː]\t茶（阳性）\tIch trinke gern Tee.\t我喜欢喝茶。\nessen\t[ˈɛsn̩]\t吃\tWir essen zusammen.\t我们一起吃饭。\ntrinken\t[ˈtʁɪŋkn̩]\t喝\tWas möchtest du trinken?\t你想喝什么？\nkaufen\t[ˈkaʊ̯fn̩]\t买\tIch kaufe ein Buch.\t我买一本书。\nbezahlen\t[bəˈtsaːlən]\t付款\tIch möchte bezahlen.\t我想结账。\ndas Geld\t[das ɡɛlt]\t钱（中性）\tIch habe kein Geld dabei.\t我没带钱。\nder Preis\t[deːɐ̯ pʁaɪ̯s]\t价格（阳性）\tDer Preis ist gut.\t价格不错。\nder Laden\t[deːɐ̯ ˈlaːdn̩]\t商店（阳性）\tDer Laden ist offen.\t商店开着门。\ndie Tasche\t[diː ˈtaʃə]\t包（阴性）\tMeine Tasche ist schwer.\t我的包很重。\nklein\t[klaɪ̯n]\t小的\tDas Zimmer ist klein.\t房间很小。\ngroß\t[ɡʁoːs]\t大的\tDas Haus ist groß.\t房子很大。\nwarm\t[vaʁm]\t温暖的\tDie Suppe ist warm.\t汤是温的。\nkalt\t[kalt]\t冷的\tHeute ist es kalt.\t今天很冷。\nbillig\t[ˈbɪlɪç]\t便宜的\tDas Brot ist billig.\t面包很便宜。\nteuer\t[ˈtɔɪ̯ɐ]\t贵的\tDas ist zu teuer.\t这太贵了。\ndas Buch\t[das buːx]\t书（中性）\tIch lese ein Buch.\t我读一本书。\ndie Schule\t[diː ˈʃuːlə]\t学校（阴性）\tDie Schule ist hier.\t学校在这里。\ndie Zeit\t[diː tsaɪ̯t]\t时间（阴性）\tIch brauche mehr Zeit.\t我需要更多时间。\ndie Frage\t[diː ˈfʁaːɡə]\t问题（阴性）\tIch habe eine Frage.\t我有一个问题。\ndie Antwort\t[diː ˈantvɔʁt]\t回答（阴性）\tDie Antwort ist richtig.\t答案是正确的。\nlesen\t[ˈleːzn̩]\t阅读\tWir lesen einen Text.\t我们读一篇课文。\nschreiben\t[ˈʃʁaɪ̯bn̩]\t写\tIch schreibe einen Brief.\t我写一封信。\nhören\t[ˈhøːʁən]\t听\tIch höre Musik.\t我听音乐。\nverstehen\t[fɛɐ̯ˈʃteːən]\t理解\tIch verstehe das Wort.\t我理解这个词。\nüben\t[ˈyːbn̩]\t练习\tWir üben die Aussprache.\t我们练习发音。\narbeiten\t[ˈaʁbaɪ̯tn̩]\t工作\tIch arbeite heute.\t我今天工作。\ngehen\t[ˈɡeːən]\t走；去\tWir gehen nach Hause.\t我们回家。\nfahren\t[ˈfaːʁən]\t乘车；行驶\tIch fahre mit dem Bus.\t我乘公交车。\nder Bus\t[deːɐ̯ bʊs]\t公交车（阳性）\tDer Bus kommt gleich.\t公交车马上就来。\nder Bahnhof\t[deːɐ̯ ˈbaːnhoːf]\t火车站（阳性）\tWo ist der Bahnhof?\t火车站在哪里？\ndie Straße\t[diː ˈʃtʁaːsə]\t街道（阴性）\tDie Straße ist lang.\t街道很长。\nlinks\t[lɪŋks]\t左边；向左\tGehen Sie nach links.\t请您向左走。\nrechts\t[ʁɛçts]\t右边；向右\tDie Schule ist rechts.\t学校在右边。\nlangsam\t[ˈlaŋzaːm]\t慢的；缓慢地\tBitte sprechen Sie langsam.\t请您说慢一点。\nschnell\t[ʃnɛl]\t快的；迅速地\tDer Zug ist schnell.\t火车很快。\n";const LETTERS=[['A','[aː]','Apfel'],['B','[beː]','Buch'],['C','[tseː]','Café'],['D','[deː]','Danke'],['E','[eː]','Ente'],['F','[ɛf]','Fisch'],['G','[ɡeː]','Guten'],['H','[haː]','Haus'],['I','[iː]','Ich'],['J','[jɔt]','Jahr'],['K','[kaː]','Kind'],['L','[ɛl]','Liebe'],['M','[ɛm]','Mutter'],['N','[ɛn]','Nacht'],['O','[oː]','Orange'],['P','[peː]','Papa'],['Q','[kuː]','Quelle'],['R','[ɛʁ]','Reise'],['S','[ɛs]','Sonne'],['T','[teː]','Tag'],['U','[uː]','Uhr'],['V','[faʊ̯]','Vater'],['W','[veː]','Wasser'],['X','[ɪks]','Taxi'],['Y','[ˈʏpsilɔn]','Yoga'],['Z','[tsɛt]','Zeit'],['Ä','[ɛː]','Äpfel'],['Ö','[øː]','Öl'],['Ü','[yː]','Tür'],['ß','[ɛsˈtsɛt]','Straße']];
(() => {
'use strict';
const $=s=>document.querySelector(s), KEY='ds-learning-v2';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const dateAfter=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
const defaults={version:2,size:20,selected:'all',progress:{},sessions:{},days:{},books:[],review:true,reviewLimit:20,links:[]};
let state=defaults;
try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(v.version!==2||!Array.isArray(v.books)||!v.sessions||!v.progress||!v.days)throw Error();state={...defaults,...v};}}catch{alert('学习记录无法读取。本页不会覆盖损坏的记录，请先导出或检查浏览器存储。');return;}
function save(change){const next=structuredClone(state);change(next);try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch{alert('保存失败：浏览器存储不可用或已满。此次操作未记入进度，请不要关闭页面。');return false}}
const builtWords=VOCAB.trim().split('\n').map((l,i)=>{const [word,ipa,meaning,example,translation]=l.split('\t');return {id:'w'+i,word,ipa,meaning,example,translation}});
const builtBooks=[{id:'all',name:'零基础核心词 · 合集',words:builtWords},{id:'greetings',name:'初次见面',words:builtWords.slice(0,20)},{id:'daily',name:'饮食与购物',words:builtWords.slice(20,40)},{id:'study',name:'学习与出行',words:builtWords.slice(40)}];
const books=()=>[...builtBooks,...state.books]; const book=()=>books().find(b=>b.id===state.selected)||builtBooks[0];
const due=()=>book().words.filter(w=>state.progress[w.id]&&state.progress[w.id].due<=today());
const unlearned=()=>book().words.filter(w=>!state.progress[w.id]);
let screen='home',mode='learn',files=[],db;
const intervals=[1,3,7,14,30];
function speak(text,slow=false){if(!('speechSynthesis'in window)){alert('此浏览器不支持朗读，请换用支持语音的浏览器。');return}const synth=window.speechSynthesis;const voices=synth.getVoices().filter(v=>/^de(-|_)/i.test(v.lang));if(!voices.length){alert('未检测到德语语音，请在设备语音设置中安装德语声音后重试。');return}synth.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.voice=voices.find(v=>v.lang==='de-DE')||voices[0];u.rate=slow?.65:.9;u.onerror=()=>alert('朗读未能完成，请检查德语语音或网络。');synth.speak(u)}
if('speechSynthesis'in window)window.speechSynthesis.getVoices();
const sound=(text)=>`<button class="audio" data-say="${esc(text)}" aria-label="朗读 ${esc(text)}">🔊</button>`;
function stats(){const days=Object.keys(state.days).filter(d=>state.days[d]>0);return `<div class="grid3"><div class="panel"><small>真实学习天数</small><h2>${days.length} 天</h2><p>只有完成单词练习才计入。</p></div><div class="panel"><small>已学词数</small><h2>${Object.keys(state.progress).length} 词</h2><p>各词书共享已学词的记录。</p></div><div class="panel"><small>本词书待复习</small><h2>${due().length} 词</h2><button data-action="review">开始复习</button></div></div>`}
function home(){return `<div class="hero"><div class="hero-copy"><span class="kicker">从零开始 · 按自己的节奏</span><h1>今天，<br>学会一点德语。</h1><p>${Object.keys(state.progress).length?'上次进度已保存，可以接着学习。':'还没有学习记录。从选一本词书开始。'}</p><button class="primary" data-page="books">选择词书</button></div><div class="phrase"><strong lang="de">Hallo! ${sound('Hallo!')}</strong><em>[haˈloː]</em><span>你好！</span><p>当前词书：${esc(book().name)}</p><button data-action="learn">${session('learn')?'继续未完成的一批':'开始一批新词'}</button></div></div>${stats()}${state.review&&due().length?'<p class="notice">今天有到期单词，建议先复习，再学新词。</p>':''}`}
function library(){return `<div class="pagehead"><h1>我的词书</h1><p>内置 60 个原创编排的入门词条，分为三本主题小词书。不是德语四六级完整考纲或商业词书。</p></div><div class="panel"><label>每批新词数量 <select id="batch">${[20,40,60].map(n=>`<option ${n===state.size?'selected':''}>${n}</option>`).join('')}</select></label><p>这是一次学习的词数，不是每日上限。未完成的一批继续原进度；不足时使用剩余词数。</p></div><div class="resources">${books().map(b=>`<article class="panel"><h2>${esc(b.name)}</h2><p>${b.words.length} 词 · 已学 ${b.words.filter(w=>state.progress[w.id]).length} 词</p><button data-book="${esc(b.id)}">${b.id===state.selected?'当前词书 · 进入':'选择这本'}</button></article>`).join('')}</div><div class="panel"><h2>导入词书</h2><p>支持 JSON 或制表符分隔的 TXT/TSV；每个词必须包含单词、IPA、释义、德语例句和中文例句释义。缺字段会明确报错，不会自动编造。PDF/Word 暂不能自动转换为词卡。</p><button data-action="template">下载导入模板</button><input aria-label="导入词书" id="import-book" type="file" accept=".json,.tsv,.txt"></div>`}
function session(m=mode){return state.sessions[state.selected+':'+m]}
function start(m){mode=m;const key=state.selected+':'+m;if(!session(m)){const words=(m==='review'?due():unlearned()).slice(0,m==='review'?state.reviewLimit:state.size);if(!words.length){alert(m==='review'?'本词书没有到期复习词。':'本词书新词已学完，可以进入复习。');return}if(!save(s=>s.sessions[key]={queue:words.map(w=>w.id),initial:words.length,done:0,revealed:false}))return}screen='learn';render()}
function study(){const s=session();if(!s)return '<div class="panel">这一批已完成。<button data-page="books">返回词书</button></div>';const w=book().words.find(w=>w.id===s.queue[0]);if(!w)return '<p>词条不存在，请更换词书。</p>';return `<div class="pagehead"><button data-page="books">← 保存并退出</button><p>${esc(book().name)} · ${mode==='review'?'到期复习':'新词学习'} · 已完成 ${s.done}/${s.initial}</p><div class="progress"><i style="width:${s.done/s.initial*100}%"></i></div></div><article class="panel study"><p>先听读，再回忆释义</p><h1 lang="de">${esc(w.word)} ${sound(w.word)}</h1><p>${esc(w.ipa)}</p><button data-slow="${esc(w.word)}">慢速朗读</button>${s.revealed?`<h2>${esc(w.meaning)}</h2><p lang="de">${esc(w.example)} ${sound(w.example)}</p><p>${esc(w.translation)}</p><div class="tabs"><button data-rate="again">还不熟 · 本批再练</button><button class="primary" data-rate="good">记住了 · 下一词</button></div>`:'<button class="primary" data-action="reveal">显示释义与例句</button>'}<p class="muted">每次操作即保存；退出或刷新后可续学。</p></article>`}
function rate(good){const s=session();if(!s||!s.revealed)return;const key=state.selected+':'+mode;const id=s.queue[0];const ok=save(n=>{const a=n.sessions[key];a.queue.shift();a.revealed=false;if(!good){a.queue.push(id);if(n.progress[id])n.progress[id].level=0;}else{const p=n.progress[id];const level=mode==='review'?Math.min((p?.level||0)+1,intervals.length-1):0;n.progress[id]={level,due:dateAfter(intervals[level]),last:today()};a.done++;n.days[today()]=(n.days[today()]||0)+1;}if(!a.queue.length)delete n.sessions[key]});if(ok){if(!session()){screen='home';alert('这一批已完成！已按间隔复习计划安排后续复习。')}render()}}
function settings(){return `<div class="pagehead"><h1>每日复习</h1><p>复习间隔：1、3、7、14、30 天。答错的词会在本批再次出现。</p></div><div class="panel"><h2>${esc(book().name)} · ${due().length} 词到期</h2><label><input id="review-toggle" type="checkbox" ${state.review?'checked':''}> 首页显示到期复习提示</label><p><label>每批复习词数 <select id="review-limit">${[20,40,60].map(n=>`<option ${n===state.reviewLimit?'selected':''}>${n}</option>`).join('')}</select></label></p><button class="primary" data-action="review">${session('review')?'继续上次复习':'开始到期复习'}</button><hr><label>每日提醒时间 <input id="reminder-time" type="time" value="20:00"></label><button data-action="calendar">下载每日复习日历提醒</button><p>需将下载的日历导入手机日历并允许提醒。网站关闭后本身不会推送通知。</p><button data-action="backup">导出学习备份</button><p>记录按浏览器保存，不按 IP；清理浏览器数据或换设备不会自动同步。</p></div>`}
function alphabet(){return `<div class="pagehead"><h1>字母与发音</h1><p>字母名、IPA 和示例词均可听读。</p></div><div class="alphabet">${LETTERS.map(([w,ipa,example])=>`<div class="alphabet-card"><b lang="de">${w} ${sound(w==='ß'?'Eszett':w)}</b><em>${ipa}</em><span lang="de">${example} ${sound(example)}</span></div>`).join('')}</div>`}
function search(){return `<div class="pagehead"><h1>网络资源</h1><p>下面是真正打开网络搜索的入口，不是本站聚合搜索。站内展示全网结果的搜索服务尚未接入。</p></div><form id="websearch" class="searchbox"><input id="keyword" aria-label="网络搜索关键词" placeholder="德语 A1 单词、听力、PDF…" required><select id="provider" aria-label="搜索来源"><option value="bing">必应资料</option><option value="bilibili">哔哩哔哩视频</option><option value="youtube">YouTube 视频</option></select><button>去网上搜索 ↗</button></form><div class="panel"><h2>站内视频播放器</h2><p>粘贴 YouTube 视频链接，或可公开播放的 HTTPS MP4/WebM 直链。播放由来源平台提供；限制嵌入、需登录或地区不可用的视频不能保证播放。</p><form id="videoform"><input id="videourl" type="url" required placeholder="https://…" aria-label="视频链接"><button>在本站播放</button></form><div id="player"></div><p id="video-status" role="status"></p></div>`}
function filesView(){return `<div class="pagehead"><h1>我的资料</h1><p>文件内容保存在当前浏览器，可以重新打开或下载；词书请在“词书”页导入。</p></div><label class="panel">保存 PDF、Word、音视频或其他资料（每份最多 20 MB）<input id="import-file" type="file" multiple></label><div class="files">${files.map(f=>`<div class="file"><span>${esc(f.name)} · ${(f.size/1048576).toFixed(2)} MB</span><button data-file="${f.id}">下载原文件</button>${/^audio\//.test(f.type)||/^video\//.test(f.type)?`<button data-media="${f.id}">播放</button>`:''}</div>`).join('')}</div><div id="local-player"></div><p>旧版导入记录只含文件名，没有原文件。请重新导入；旧记录未被删除。</p><div class="panel"><h2>收藏网络资源</h2><form id="bookmark-form"><input id="bookmark-title" placeholder="资源名称" required maxlength="150"><input id="bookmark-url" type="url" placeholder="https://…" required><button>收藏链接</button></form><div id="bookmarks">${state.links.map(l=>`<p><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)} ↗</a></p>`).join('')}</div></div>`}
function render(){const views={home,books:library,learn:study,review:settings,alphabet,search,files:filesView};$('#content').innerHTML=views[screen]();document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===screen));window.scrollTo(0,0)}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function calendar(){const t=$('#reminder-time').value;if(!/^\d{2}:\d{2}$/.test(t)){alert('请选择时间');return}const stamp=today().replaceAll('-','')+'T'+t.replace(':','')+'00';download('BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Deutsch Start//Review//ZH\r\nBEGIN:VEVENT\r\nUID:'+crypto.randomUUID()+'@deutsch-start\r\nDTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')+'\r\nDTSTART:'+stamp+'\r\nDURATION:PT15M\r\nRRULE:FREQ=DAILY\r\nSUMMARY:德语单词复习\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:开始德语复习\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR','德语每日复习.ics','text/calendar')}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.say)return speak(b.dataset.say);if(b.dataset.slow)return speak(b.dataset.slow,true);if(b.dataset.page){screen=b.dataset.page;render();return}if(b.dataset.book){if(save(s=>s.selected=b.dataset.book))start('learn');return}if(b.dataset.rate){rate(b.dataset.rate==='good');return}const actions={learn:()=>start('learn'),review:()=>start('review'),reveal:()=>{if(save(s=>s.sessions[state.selected+':'+mode].revealed=true))render()},calendar,template:()=>download(JSON.stringify({name:'我的词书',words:[builtWords[0]]},null,2),'词书模板.json','application/json'),backup:()=>download(JSON.stringify(state,null,2),'德语学习备份.json','application/json')};if(actions[b.dataset.action])actions[b.dataset.action]();if(b.dataset.file||b.dataset.media){const f=files.find(f=>f.id===(b.dataset.file||b.dataset.media));if(!f)return;if(b.dataset.file)download(f.blob,f.name,f.type);else{const el=document.createElement(f.type.startsWith('audio')?'audio':'video');el.controls=true;el.src=URL.createObjectURL(f.blob);el.style.width='100%';$('#local-player').replaceChildren(el)}}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='batch')save(s=>s.size=Number(el.value));if(el.id==='review-limit')save(s=>s.reviewLimit=Number(el.value));if(el.id==='review-toggle')save(s=>s.review=el.checked);if(el.id==='import-book'){try{const f=el.files[0];if(!f)return;if(f.size>3000000)throw Error('词书文件不能超过 3 MB。');const txt=await f.text();let data;if(f.name.endsWith('.json'))data=JSON.parse(txt);else data={name:f.name,words:txt.trim().split(/\r?\n/).map(l=>{const [word,ipa,meaning,example,translation]=l.split('\t');return {word,ipa,meaning,example,translation}})};if(!Array.isArray(data.words)||!data.words.length||data.words.length>5000)throw Error('每本词书需要 1–5000 个词。');const id=crypto.randomUUID();const words=data.words.map((w,i)=>{for(const k of ['word','ipa','meaning','example','translation'])if(typeof w[k]!=='string'||!w[k].trim()||w[k].length>2000)throw Error('第 '+(i+1)+' 行缺少或超长字段：'+k);return {...w,id:id+'-'+i}});if(save(s=>s.books.push({id,name:String(data.name||f.name).slice(0,100),words})))render()}catch(err){alert('未导入：'+err.message)}}if(el.id==='import-file'){if(!db){alert('文件存储不可用，请允许浏览器使用本地存储。');return}for(const f of el.files){if(f.size>20*1048576){alert(f.name+' 超过 20 MB，未保存');continue}try{const item={id:crypto.randomUUID(),name:f.name,size:f.size,type:f.type,blob:f};await new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});files.push(item)}catch{alert('文件保存失败，可能空间不足。')}}render()}});
document.addEventListener('submit',e=>{if(e.target.id==='websearch'){e.preventDefault();const q=encodeURIComponent($('#keyword').value.trim()+' 德语');const urls={bing:'https://www.bing.com/search?q=',bilibili:'https://search.bilibili.com/all?keyword=',youtube:'https://www.youtube.com/results?search_query='};window.open(urls[$('#provider').value]+q,'_blank','noopener,noreferrer')}if(e.target.id==='videoform'){e.preventDefault();try{const u=new URL($('#videourl').value);if(u.protocol!=='https:')throw Error('只接受 HTTPS 链接');let id;if(['youtube.com','www.youtube.com','m.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([\w-]{11})/)?.[1];if(u.hostname==='youtu.be')id=u.pathname.slice(1);let el;if(id&&/^[\w-]{11}$/.test(id)){el=document.createElement('iframe');el.src='https://www.youtube-nocookie.com/embed/'+id;el.allow='fullscreen; encrypted-media; picture-in-picture';el.allowFullscreen=true;el.title='YouTube 视频播放器';el.referrerPolicy='strict-origin-when-cross-origin'}else if(/\.(mp4|webm)$/i.test(u.pathname)){el=document.createElement('video');el.src=u.href;el.controls=true;el.onerror=()=>$('#video-status').textContent='视频未能加载，请检查源地址、权限或网络。'}else throw Error('暂支持 YouTube 视频链接或 MP4/WebM 直链，不支持把普通网页当作视频播放');el.style.cssText='width:100%;min-height:240px;aspect-ratio:16/9;border:0;margin-top:16px';$('#player').replaceChildren(el);$('#video-status').textContent='如果播放器提示禁止嵌入或无法访问，请到源网站播放。'}catch(err){$('#video-status').textContent=err.message}}});
try{const req=indexedDB.open('ds-materials-v2',1);req.onupgradeneeded=()=>req.result.createObjectStore('files',{keyPath:'id'});req.onsuccess=()=>{db=req.result;const read=db.transaction('files').objectStore('files').getAll();read.onsuccess=()=>{files=read.result;if(screen==='files')render()}};req.onerror=()=>console.warn('文件存储不可用')}catch{}
try{const previous=JSON.parse(localStorage.getItem('ds-favs')||'[]');const mapping={dw1:['Nicos Weg A1','https://learngerman.dw.com/zh/nicos-weg/c-45451288'],goethe1:['Deutsch für dich','https://www.goethe.de/prj/dfd/de/home.cfm'],vhs1:['A1-Deutschkurs','https://a1.vhs-lernportal.de/'],easy1:['Easy German','https://www.easygerman.org/']};if(!state.migratedFavorites)save(s=>{previous.forEach(id=>{if(mapping[id])s.links.push({title:mapping[id][0],url:mapping[id][1]})});s.migratedFavorites=true})}catch{}
document.addEventListener('submit',e=>{if(e.target.id!=='bookmark-form')return;e.preventDefault();try{const url=new URL($('#bookmark-url').value);if(url.protocol!=='https:')throw Error();if(save(s=>s.links.push({title:$('#bookmark-title').value.trim(),url:url.href})))render()}catch{alert('请输入有效的 HTTPS 资源链接。')}});
render();
})();
</script></body></html>
